[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-vllm"
version = "0.1.0"
description = "A small, educational vLLM implementation."
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.26,<2",
    "safetensors>=0.4,<1",
    # Validated on the remote Tesla T4 baseline with PyTorch 2.8.x.
    "torch>=2.4,<2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    # Used only to construct reference Llama/Qwen models for parity tests.
    "transformers>=4.51,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["micro_vllm*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a visible CUDA GPU",
    "model: tests that access an external model repository or shared model cache",
]
